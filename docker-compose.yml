services:
  postgres:
    image: postgres:16-alpine
    container_name: nbryo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nbryo
      POSTGRES_PASSWORD: nbryo
      POSTGRES_DB: nbryo
    ports:
      - '5433:5432'
    volumes:
      - nbryo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nbryo -d nbryo']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nbryo-pgdata:
